[project]
name = "industrial-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mariano Vera Causich", email = "95258268+MarianoVera22@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncua>=2.0.1",
]

[project.scripts]
industrial-gateway = "industrial_gateway:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "RET",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--cov=industrial_gateway --cov-report=term-missing"
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = ["asyncua.*"]
implicit_reexport = true